# ================================================================
# Docker Compose — Locadora de Imóveis
#
# Serviços incluídos:
#   db        → PostgreSQL 15 com extensões Supabase
#   auth      → GoTrue (autenticação / JWT)
#   rest      → PostgREST (API REST automática do banco)
#   realtime  → Supabase Realtime (WebSocket / chat)
#   storage   → Supabase Storage (uploads de fotos e documentos)
#   imgproxy  → Otimizador de imagens para o Storage
#   api       → Nginx (gateway que une todos os serviços na porta 8000)
#   inbucket  → Servidor SMTP local (captura e-mails, não envia de verdade)
#   app       → Aplicação Next.js (porta 3000)
#
# Antes de rodar:
#   cp .env.docker .env
#   # Edite o .env (JWT_SECRET, gere chaves, etc.)
#   node scripts/gerar-chaves.mjs
#   docker compose up --build
# ================================================================

services:

  # ================================================================
  # BANCO DE DADOS
  # ================================================================
  db:
    image: supabase/postgres:15.1.0.117
    restart: unless-stopped
    ports:
      - "5432:5432"    # Acesso direto ao banco (opcional)
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      # Scripts oficiais de bootstrap do Supabase (criam/ajustam roles internas)
      - ./supabase/init/init-scripts/98-webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./supabase/init/init-scripts/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/init/init-scripts/99-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./supabase/init/migrations/97-_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./supabase/init/migrations/99-realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./supabase/init/migrations/99-logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./supabase/init/migrations/99-pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      # NOTA: supabase/schema.sql (tabelas da aplicação) NÃO é montado aqui.
      # Ele referencia auth.users, que só existe depois que o serviço `auth` sobe
      # e roda suas próprias migrações. Aplique manualmente após `docker compose up`:
      #   docker compose exec -T db psql -U postgres -d postgres < supabase/schema.sql
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================================================
  # AUTENTICAÇÃO (GoTrue)
  # ================================================================
  auth:
    image: supabase/gotrue:v2.132.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXPIRY: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-inbucket}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-2500}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@locadora.local}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================================================
  # API REST (PostgREST — lê o banco automaticamente)
  # ================================================================
  rest:
    image: postgrest/postgrest:v12.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # ================================================================
  # REALTIME (WebSocket para o chat)
  # ================================================================
  realtime:
    image: supabase/realtime:v2.25.35
    restart: unless-stopped
    ports:
      - "4000:4000"    # Acesso direto à API admin (seed de tenant) — opcional
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOT_ID: localdev
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"

  # ================================================================
  # STORAGE (fotos de imóveis, documentos, chat)
  # ================================================================
  storage:
    image: supabase/storage-api:v0.46.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage

  # ================================================================
  # IMGPROXY (redimensiona imagens on-the-fly)
  # ================================================================
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage-data:/var/lib/storage:ro

  # ================================================================
  # GATEWAY (Nginx — unifica todos os serviços na porta 8000)
  # ================================================================
  api:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      realtime:
        condition: service_started
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/auth/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================================================
  # EMAIL LOCAL (Inbucket — captura e-mails de convite/recuperação)
  # Acesse os e-mails em: http://localhost:9000
  # ================================================================
  inbucket:
    image: inbucket/inbucket:3.0.3
    restart: unless-stopped
    ports:
      - "9000:9000"    # Interface web
      - "2500:2500"    # SMTP (interno)

  # ================================================================
  # APLICAÇÃO NEXT.JS
  # ================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL que o BROWSER usa para acessar o Supabase.
        # Mude para seu domínio ao fazer deploy no Hostinger.
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # URL baked no bundle (browser) — deve coincidir com o build arg acima
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # URL interna Docker: o servidor Next.js usa esta para falar com o Nginx
      # internamente (sem passar por localhost do host)
      SUPABASE_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:      # Dados persistentes do PostgreSQL
  storage-data: # Arquivos (fotos, documentos, chat)
